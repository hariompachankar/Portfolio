<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12242a"/>
      <stop offset="60%" stop-color="#174c55"/>
      <stop offset="100%" stop-color="#50ada7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg1)"/>

  <!-- ID badge -->
  <g transform="translate(140,45)">
    <rect x="0" y="0" width="120" height="150" rx="14" fill="#0d1f24" stroke="#8fe3d8" stroke-width="2"/>
    <circle cx="60" cy="20" r="6" fill="#8fe3d8"/>
    <circle cx="60" cy="60" r="22" fill="#2a4a4f" stroke="#8fe3d8" stroke-width="2"/>
    <path d="M40 100 q20 -18 40 0 v14 h-40 z" fill="#2a4a4f" stroke="#8fe3d8" stroke-width="2"/>
    <rect x="25" y="122" width="70" height="6" rx="3" fill="#8fe3d8" opacity="0.6"/>
    <rect x="35" y="134" width="50" height="6" rx="3" fill="#8fe3d8" opacity="0.35"/>
  </g>

  <!-- checkmark shield -->
  <g transform="translate(255,130)">
    <circle cx="0" cy="0" r="30" fill="#0d1f24" stroke="#8fe3d8" stroke-width="2"/>
    <path d="M-12 0 L-3 10 L14 -10" stroke="#8fe3d8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- scanner lines -->
  <g stroke="#8fe3d8" stroke-width="2" opacity="0.5">
    <line x1="60" y1="60" x2="90" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="90"/>
    <line x1="60" y1="190" x2="90" y2="190"/>
    <line x1="60" y1="190" x2="60" y2="160"/>
    <line x1="340" y1="60" x2="310" y2="60"/>
    <line x1="340" y1="60" x2="340" y2="90"/>
    <line x1="340" y1="190" x2="310" y2="190"/>
    <line x1="340" y1="190" x2="340" y2="160"/>
  </g>
</svg>
