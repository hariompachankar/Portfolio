<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20142f"/>
      <stop offset="60%" stop-color="#553063"/>
      <stop offset="100%" stop-color="#bb76cf"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg2)"/>

  <!-- axis -->
  <g stroke="#e6c9f0" stroke-width="2" opacity="0.5">
    <line x1="70" y1="60" x2="70" y2="200"/>
    <line x1="70" y1="200" x2="340" y2="200"/>
  </g>

  <!-- bars -->
  <g fill="#e6c9f0">
    <rect x="100" y="150" width="26" height="50" rx="3" opacity="0.55"/>
    <rect x="145" y="120" width="26" height="80" rx="3" opacity="0.7"/>
    <rect x="190" y="90" width="26" height="110" rx="3" opacity="0.85"/>
    <rect x="235" y="60" width="26" height="140" rx="3"/>
  </g>

  <!-- growth arrow line -->
  <path d="M100 160 L150 130 L195 95 L245 65 L285 45" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M270 40 L285 45 L280 60" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- handshake dots (connection) -->
  <circle cx="300" cy="150" r="8" fill="#ffffff"/>
  <circle cx="330" cy="170" r="8" fill="#ffffff" opacity="0.6"/>
  <line x1="300" y1="150" x2="330" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>
